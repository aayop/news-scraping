<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>News Intelligence Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --surface2: #1a1a26;
    --border: #2a2a3a;
    --accent: #00e5ff;
    --accent2: #ff6b6b;
    --accent3: #a8ff78;
    --accent4: #ffbe0b;
    --text: #e8e8f0;
    --muted: #6b6b8a;
    --font-mono: 'Space Mono', monospace;
    --font-sans: 'DM Sans', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Animated grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,229,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 1300px;
    margin: 0 auto;
    padding: 0 24px;
    position: relative;
    z-index: 1;
  }

  /* Header */
  header {
    padding: 40px 0 32px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 40px;
  }

  .header-inner {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .logo-icon {
    width: 48px;
    height: 48px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    animation: pulse 3s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(0,229,255,0.3); }
    50% { box-shadow: 0 0 20px 8px rgba(0,229,255,0.1); }
  }

  h1 {
    font-family: var(--font-mono);
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: -0.5px;
    line-height: 1.2;
  }

  h1 span {
    color: var(--accent);
  }

  .subtitle {
    font-size: 0.8rem;
    color: var(--muted);
    font-family: var(--font-mono);
    margin-top: 4px;
  }

  .live-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(168,255,120,0.1);
    border: 1px solid rgba(168,255,120,0.3);
    border-radius: 100px;
    padding: 6px 14px;
    font-size: 0.75rem;
    font-family: var(--font-mono);
    color: var(--accent3);
  }

  .live-dot {
    width: 7px;
    height: 7px;
    background: var(--accent3);
    border-radius: 50%;
    animation: blink 1.5s ease-in-out infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.2; }
  }

  /* Stat cards */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 32px;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    position: relative;
    overflow: hidden;
    animation: fadeUp 0.6s ease both;
    transition: transform 0.2s, border-color 0.2s;
  }

  .stat-card:hover {
    transform: translateY(-3px);
    border-color: var(--accent);
  }

  .stat-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--card-accent, var(--accent));
  }

  .stat-card:nth-child(1) { --card-accent: var(--accent);  animation-delay: 0.1s; }
  .stat-card:nth-child(2) { --card-accent: var(--accent2); animation-delay: 0.2s; }
  .stat-card:nth-child(3) { --card-accent: var(--accent3); animation-delay: 0.3s; }
  .stat-card:nth-child(4) { --card-accent: var(--accent4); animation-delay: 0.4s; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .stat-label {
    font-size: 0.72rem;
    color: var(--muted);
    font-family: var(--font-mono);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 10px;
  }

  .stat-value {
    font-family: var(--font-mono);
    font-size: 2.4rem;
    font-weight: 700;
    color: var(--card-accent, var(--accent));
    line-height: 1;
    margin-bottom: 4px;
  }

  .stat-sub {
    font-size: 0.78rem;
    color: var(--muted);
  }

  /* Charts grid */
  .charts-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 20px;
  }

  .chart-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    animation: fadeUp 0.6s ease both;
    animation-delay: 0.3s;
  }

  .chart-card.full-width {
    grid-column: 1 / -1;
  }

  .chart-title {
    font-family: var(--font-mono);
    font-size: 0.8rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .chart-title::before {
    content: '';
    width: 3px;
    height: 14px;
    background: var(--accent);
    border-radius: 2px;
  }

  .chart-wrap {
    position: relative;
    height: 240px;
  }

  /* Keywords section */
  .keywords-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 8px;
  }

  .keyword-tag {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 14px;
    font-size: 0.82rem;
    font-family: var(--font-mono);
    transition: all 0.2s;
    cursor: default;
  }

  .keyword-tag:hover {
    border-color: var(--accent);
    background: rgba(0,229,255,0.05);
    transform: scale(1.03);
  }

  .keyword-freq {
    font-size: 0.7rem;
    color: var(--accent);
    font-weight: 700;
  }

  /* Articles table */
  .table-wrap {
    overflow-x: auto;
    margin-top: 8px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
  }

  th {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    padding: 10px 16px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }

  td {
    padding: 12px 16px;
    border-bottom: 1px solid rgba(42,42,58,0.5);
    vertical-align: top;
    max-width: 300px;
  }

  tr:hover td { background: rgba(255,255,255,0.02); }

  .source-badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 6px;
    font-size: 0.7rem;
    font-family: var(--font-mono);
    font-weight: 700;
  }

  .lang-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 0.68rem;
    font-family: var(--font-mono);
  }

  .footer {
    text-align: center;
    padding: 40px 0 32px;
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 0.72rem;
    border-top: 1px solid var(--border);
    margin-top: 40px;
  }

  @media (max-width: 768px) {
    .charts-grid { grid-template-columns: 1fr; }
    .chart-card.full-width { grid-column: 1; }
    h1 { font-size: 1.2rem; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-inner">
      <div class="logo">
        <div class="logo-icon">📡</div>
        <div>
          <h1>News<span>Intelligence</span></h1>
          <div class="subtitle">// Big Data Media Analytics Platform</div>
        </div>
      </div>
      <div class="live-badge">
        <div class="live-dot"></div>
        LIVE DASHBOARD
      </div>
    </div>
  </header>

  <!-- STAT CARDS -->
  <div class="stats-grid" id="statsGrid"></div>

  <!-- CHARTS -->
  <div class="charts-grid">
    <div class="chart-card">
      <div class="chart-title">Articles by Source</div>
      <div class="chart-wrap"><canvas id="sourceChart"></canvas></div>
    </div>
    <div class="chart-card">
      <div class="chart-title">Articles by Language</div>
      <div class="chart-wrap"><canvas id="langChart"></canvas></div>
    </div>
    <div class="chart-card">
      <div class="chart-title">Articles by Category</div>
      <div class="chart-wrap"><canvas id="categoryChart"></canvas></div>
    </div>
    <div class="chart-card full-width">
      <div class="chart-title">Articles by Date</div>
      <div class="chart-wrap"><canvas id="dateChart"></canvas></div>
    </div>
    <div class="chart-card full-width">
      <div class="chart-title">Top Keywords</div>
      <div class="chart-wrap" style="height:200px"><canvas id="keywordChart"></canvas></div>
    </div>
  </div>

  <!-- KEYWORDS TAGS -->
  <div class="chart-card" style="margin-bottom:20px">
    <div class="chart-title">Trending Keywords</div>
    <div class="keywords-grid" id="keywordTags"></div>
  </div>

  <!-- ARTICLES TABLE -->
  <div class="chart-card">
    <div class="chart-title">Recent Articles</div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Title</th>
            <th>Source</th>
            <th>Category</th>
            <th>Language</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody id="articlesTable"></tbody>
      </table>
    </div>
  </div>

  <div class="footer">
    EMSI Casablanca — IADATA 2025/2026 — Big Data News Platform
  </div>
</div>

<script>
// ─── LOAD DATA FROM GOLD LAYER JSON FILES ───────────────────────────────────
// 
// HOW TO USE:
// Since browsers can't read local files directly, you have two options:
//
// OPTION 1 (Easy): Run a simple Python server:
//   python -m http.server 8000
//   Then open http://localhost:8000/dashboard.html
//
// OPTION 2: Paste your JSON data directly into the variables below.
//

// ─── LOAD GOLD DATA AUTOMATICALLY ─────────────────────────────────────────
//
// The dashboard now loads data from the built gold files at /data_lake/gold/*.json
// when served from a local server or the Docker dashboard service.

// ── PASTE YOUR GOLD DATA HERE ──────────────────────────────────────────────
const DATA = {
  summary: {
    total_articles: 0,
    total_sources: 0,
    sources: [],
    languages: [],
    avg_content_length: 0,
    generated_at: null,
  },
  bySource: [],
  byLanguage: [],
  byDate: [],
  byCategory: [],
  keywords: [],
  articles: [],
};
// ── REPLACE DATA ABOVE WITH YOUR ACTUAL GOLD FILES ──────────────────────────

async function fetchJson(path) {
  try {
    const res = await fetch(path);
    if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
    return await res.json();
  } catch (error) {
    console.warn(`Dashboard: failed to load ${path}:`, error);
    return null;
  }
}

async function loadGoldData() {
  const timestamp = Date.now();
  const [summary, bySource, byLanguage, byDate, byCategory, keywords, articles] = await Promise.all([
    fetchJson(`/data_lake/gold/summary_stats.json?t=${timestamp}`),
    fetchJson(`/data_lake/gold/articles_by_source.json?t=${timestamp}`),
    fetchJson(`/data_lake/gold/articles_by_language.json?t=${timestamp}`),
    fetchJson(`/data_lake/gold/articles_by_date.json?t=${timestamp}`),
    fetchJson(`/data_lake/gold/articles_by_category.json?t=${timestamp}`),
    fetchJson(`/data_lake/gold/top_keywords.json?t=${timestamp}`),
    fetchJson(`/data_lake/gold/articles.json?t=${timestamp}`),
  ]);

  if (summary) DATA.summary = summary;
  if (bySource) DATA.bySource = bySource;
  if (byLanguage) DATA.byLanguage = byLanguage;
  if (byDate) DATA.byDate = byDate;
  if (byCategory) DATA.byCategory = byCategory;
  if (keywords) DATA.keywords = keywords;
  if (articles) DATA.articles = articles;
}

function showDataWarning() {
  if (DATA.bySource.length === 0 || DATA.byLanguage.length === 0) {
    const info = document.createElement('div');
    info.style.margin = '20px 0';
    info.style.padding = '16px';
    info.style.border = '1px solid rgba(255,255,255,0.12)';
    info.style.borderRadius = '14px';
    info.style.background = 'rgba(255,255,255,0.02)';
    info.style.color = 'var(--muted)';
    info.innerText = 'Real dashboard data could not be loaded automatically. Serve the project from the repository root with a local HTTP server or ensure /data_lake is available to the dashboard server.';
    const container = document.querySelector('.container');
    const insertBefore = document.querySelector('.stats-grid');
    if (container && insertBefore) {
      container.insertBefore(info, insertBefore);
    }
  }
}

function formatNumber(value) {
  return typeof value === 'number' ? value.toLocaleString() : value || '0';
}

function createChart(canvasId, labels, data, backgroundColor, borderColor, type = 'bar') {
  const ctx = document.getElementById(canvasId);
  if (!ctx) return;
  if (ctx.chart) ctx.chart.destroy();

  ctx.chart = new Chart(ctx, {
    type,
    data: {
      labels,
      datasets: [{
        label: 'Count',
        data,
        backgroundColor,
        borderColor,
        borderWidth: 1,
        borderRadius: 6,
      }],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        x: {
          ticks: { color: '#c7c7da' },
          grid: { color: 'rgba(255,255,255,0.05)' },
        },
        y: {
          ticks: { color: '#c7c7da' },
          grid: { color: 'rgba(255,255,255,0.05)' },
        },
      },
      plugins: {
        legend: { display: false },
        tooltip: { enabled: true },
      },
    },
  });
}

function renderStats() {
  const statsGrid = document.getElementById('statsGrid');
  if (!statsGrid) return;
  const summary = DATA.summary || {};
  const cards = [
    { label: 'Total Articles', value: formatNumber(summary.total_articles) },
    { label: 'Sources', value: formatNumber(summary.sources?.length) },
    { label: 'Languages', value: formatNumber(summary.languages?.length) },
    { label: 'Avg. Content Length', value: formatNumber(summary.avg_content_length) },
    { label: 'Last Updated', value: summary.generated_at ? new Date(summary.generated_at).toLocaleString() : 'N/A' },
  ];
  statsGrid.innerHTML = cards.map(card => `
    <div class="stat-card">
      <div class="stat-label">${card.label}</div>
      <div class="stat-value">${card.value}</div>
    </div>
  `).join('');
}

function renderSourceChart() {
  const labels = DATA.bySource.map(item => item.source || 'Unknown');
  const values = DATA.bySource.map(item => item.article_count || 0);
  createChart('sourceChart', labels, values, 'rgba(0,229,255,0.6)', 'rgba(0,229,255,1)');
}

function renderLangChart() {
  const labels = DATA.byLanguage.map(item => item.language || item.language_code || 'Unknown');
  const values = DATA.byLanguage.map(item => item.article_count || 0);
  createChart('langChart', labels, values, 'rgba(168,255,120,0.6)', 'rgba(168,255,120,1)');
}

function renderCategoryChart() {
  const labels = DATA.byCategory.map(item => item.category || 'Unknown');
  const values = DATA.byCategory.map(item => item.article_count || 0);
  createChart('categoryChart', labels, values, 'rgba(255,107,107,0.6)', 'rgba(255,107,107,1)');
}

function renderDateChart() {
  const labels = DATA.byDate.map(item => item.date || 'Unknown');
  const values = DATA.byDate.map(item => item.article_count || 0);
  createChart('dateChart', labels, values, 'rgba(163,103,255,0.6)', 'rgba(163,103,255,1)', 'line');
}

function renderKeywordChart() {
  const topKeywords = DATA.keywords.slice(0, 10);
  const labels = topKeywords.map(item => item.keyword || '');
  const values = topKeywords.map(item => item.frequency || 0);
  createChart('keywordChart', labels, values, 'rgba(255,190,11,0.6)', 'rgba(255,190,11,1)');
}

function renderKeywordTags() {
  const container = document.getElementById('keywordTags');
  if (!container) return;
  container.innerHTML = DATA.keywords.slice(0, 12).map(item => `
    <div class="keyword-tag">
      <span>#${item.keyword}</span>
      <span class="keyword-freq">${formatNumber(item.frequency)}</span>
    </div>
  `).join('');
}

function renderTable() {
  const tableBody = document.getElementById('articlesTable');
  if (!tableBody) return;
  if (!DATA.articles.length) {
    tableBody.innerHTML = `
      <tr>
        <td colspan="5" style="color: var(--muted); padding: 24px; text-align: center;">
          Article detail table is empty because the gold layer contains summary analytics only.
        </td>
      </tr>
    `;
    return;
  }
  tableBody.innerHTML = DATA.articles.slice(0, 10).map(article => `
    <tr>
      <td>${article.title || 'Untitled'}</td>
      <td>${article.source || 'Unknown'}</td>
      <td>${article.category || 'General'}</td>
      <td>${article.language || 'N/A'}</td>
      <td>${article.publication_date ? new Date(article.publication_date).toLocaleDateString() : 'N/A'}</td>
    </tr>
  `).join('');
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
async function initDashboard() {
  await loadGoldData();
  showDataWarning();
  renderStats();
  renderSourceChart();
  renderLangChart();
  renderCategoryChart();
  renderDateChart();
  renderKeywordChart();
  renderKeywordTags();
  renderTable();
}

initDashboard();
</script>
</body>
</html>
