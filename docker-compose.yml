version: '3.8'

services:
  news-intelligence:
    build: .
    container_name: news-intelligence-platform
    volumes:
      # Mount data directories to persist data between runs
      - ./data_lake:/app/data_lake
      - ./reports:/app/reports
      - ./logs:/app/logs
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      # Add any scraping configuration here
      - SCRAPER_TIMEOUT=30
      - MAX_ARTICLES_PER_SOURCE=50
      - DATA_LAKE_BACKEND=local
      - DATA_LAKE_S3_ENDPOINT=http://minio:9000
      - DATA_LAKE_S3_ACCESS_KEY=minioadmin
      - DATA_LAKE_S3_SECRET_KEY=minioadmin
      - DATA_LAKE_S3_BUCKET=news-data-lake
      - MYSQL_HOST=host.docker.internal
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=
      - MYSQL_DATABASE=news_warehouse
    restart: unless-stopped
    depends_on:
      - minio
    command: ["python", "pipeline.py", "--skip-scraping"]  # Default to skip scraping in container

  minio:
    image: minio/minio:latest
    container_name: news-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./minio_data:/data
    command: ["server", "/data", "--console-address", ":9001"]
    restart: unless-stopped

  # Optional: Add a web server for the dashboard
  dashboard-server:
    image: nginx:alpine
    container_name: news-dashboard-server
    ports:
      - "8080:80"
    volumes:
      - ./dashboard.html:/usr/share/nginx/html/index.html
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - news-intelligence
    restart: unless-stopped
    profiles:
      - dashboard

  # Optional: Add a scheduled runner for periodic execution
  scheduler:
    build: .
    container_name: news-scheduler
    volumes:
      - ./data_lake:/app/data_lake
      - ./reports:/app/reports
      - ./logs:/app/logs
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - SCRAPER_TIMEOUT=30
      - MAX_ARTICLES_PER_SOURCE=50
      - MYSQL_HOST=host.docker.internal
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=
      - MYSQL_DATABASE=news_warehouse
    command: ["sh", "-c", "while true; do echo 'Running scheduled pipeline...'; python pipeline.py; echo 'Sleeping for 1 hour...'; sleep 3600; done"]
    restart: unless-stopped
    profiles:
      - scheduler

networks:
  default:
    name: news-intelligence-network
